name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: music_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d music_shop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/music_shop_test
      - run: npm test -- --runInBand
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/music_shop_test
          CLIENT_ORIGIN: http://localhost:3000
          SESSION_SECURE_COOKIE: "false"
          AUTO_SEED_MOCK_DATA: "false"
          PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
          PUBLIC_ORDER_TRACKING_SECRET: ci-tracking-secret
      - run: npm run db:seed:upsert
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/music_shop_test
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/music_shop_test
          CLIENT_ORIGIN: http://localhost:3000
          SESSION_SECURE_COOKIE: "false"
          AUTO_SEED_MOCK_DATA: "false"
          PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
          PUBLIC_ORDER_TRACKING_SECRET: ci-tracking-secret
